    <path d="M 50 76 C 44 70, 41 62, 37 55 L 45 56 L 46 47 L 51 54 L 57 47 L 57 56 L 64 55 C 60 62, 56 70, 50 76 Z" fill="#f2b738" stroke-width="2.3" />
