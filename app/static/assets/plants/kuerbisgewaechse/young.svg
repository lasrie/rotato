    <path d="M 56 48 L 68 29" fill="none" stroke="#2f2a24" stroke-width="1.2" />

    <!-- 4. GROSSE GOLDGELBE ZUCCHINI-TRICHTERBLÜTE im Zentrum (#f2b738 & #ffd166) -->
