    <path d="M 69 64 L 86 57 M 76 61 L 83 67 M 75 59 L 77 51" fill="none" stroke="#b8d9a3" stroke-width="1.8" />
    <path d="M 69 64 L 86 57" fill="none" stroke="#2f2a24" stroke-width="1.1" />

    <!-- Großes Vorderblatt Links-Oben -->
