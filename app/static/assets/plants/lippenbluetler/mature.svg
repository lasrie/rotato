<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2f2a24" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Tiefer Hintergrund-Busch (Dunkles Salbei-/Kräutergrün #486b3d) -->
    <path d="M 44 74 C 28 73, 14 66, 11 54 C 9 45, 20 40, 31 46 C 38 50, 42 62, 44 74 Z" fill="#486b3d" stroke-width="2.2" />
    <path d="M 56 74 C 72 73, 86 66, 89 54 C 91 45, 80 40, 69 46 C 62 50, 58 62, 56 74 Z" fill="#486b3d" stroke-width="2.2" />
    <path d="M 46 52 C 34 45, 24 35, 26 25 C 28 18, 38 19, 44 28 C 47 34, 47 44, 46 52 Z" fill="#486b3d" stroke-width="2.2" />
    <path d="M 54 52 C 66 45, 76 35, 74 25 C 72 18, 62 19, 56 28 C 53 34, 53 44, 54 52 Z" fill="#486b3d" stroke-width="2.2" />

    <!-- 2. Kräftige, dreifach verzweigte Stängelbasis mit Wurzel bei (50, 96) -->
    <path d="M 29 96 C 40 95, 45 90, 46 81 C 45 73, 40 65, 33 58 L 36 55 C 42 61, 46 68, 48 75 L 48.5 42 L 51.5 42 L 52 75 C 54 68, 58 61, 64 55 L 67 58 C 60 65, 55 73, 54 81 C 55 90, 60 95, 71 96 C 61 96, 56 94, 53 96 C 51 95, 49 95, 47 96 C 44 94, 39 96, 29 96 Z" fill="#8f7854" stroke-width="2.4" />
    <!-- Wurzel-Linien -->
    <path d="M 48 84 C 47 90, 43 94, 37 95.5 M 52 84 C 53 90, 57 94, 63 95.5 M 50 86 L 50 96" fill="none" stroke-width="1.3" />

    <!-- 3. BLÜTENÄHREN (Typisch Lippenblütler: etagenförmige Quirle oben) -->
    <!-- Mittlere Haupt-Blütenkerze -->
    <path d="M 50 38 L 50 10" fill="none" stroke="#6e995b" stroke-width="2.2" />
    <path d="M 50 38 L 50 10" fill="none" stroke="#2f2a24" stroke-width="1.8" />
    <!-- Blütenquirl-Etagen Mitte (Zartes Lavendel-Creme #e8dff0 & #d5c3e8) -->
    <ellipse cx="47" cy="24" rx="3" ry="2" fill="#d5c3e8" stroke-width="1.7" />
    <ellipse cx="53" cy="24" rx="3" ry="2" fill="#e8dff0" stroke-width="1.7" />
    <ellipse cx="50" cy="23" rx="2.5" ry="2" fill="#f5f0f9" stroke-width="1.7" />

    <ellipse cx="47.5" cy="18" rx="2.8" ry="1.8" fill="#d5c3e8" stroke-width="1.7" />
    <ellipse cx="52.5" cy="18" rx="2.8" ry="1.8" fill="#e8dff0" stroke-width="1.7" />
    <ellipse cx="50" cy="17" rx="2.2" ry="1.8" fill="#f5f0f9" stroke-width="1.7" />

    <ellipse cx="48.5" cy="12.5" rx="2.2" ry="1.5" fill="#d5c3e8" stroke-width="1.6" />
    <ellipse cx="51.5" cy="12.5" rx="2.2" ry="1.5" fill="#e8dff0" stroke-width="1.6" />
    <circle cx="50" cy="9.5" r="2" fill="#9ec486" stroke-width="1.6" />

    <!-- Linke Seiten-Blütenkerze -->
    <path d="M 38 38 L 32 18" fill="none" stroke="#2f2a24" stroke-width="1.7" />
    <ellipse cx="33" cy="27" rx="2.6" ry="1.8" fill="#d5c3e8" stroke-width="1.6" />
    <ellipse cx="37" cy="26" rx="2.6" ry="1.8" fill="#e8dff0" stroke-width="1.6" />
    <ellipse cx="31.5" cy="21.5" rx="2.2" ry="1.5" fill="#d5c3e8" stroke-width="1.6" />
    <ellipse cx="35" cy="20.5" rx="2.2" ry="1.5" fill="#f5f0f9" stroke-width="1.6" />

    <!-- Rechte Seiten-Blütenkerze -->
    <path d="M 62 38 L 68 18" fill="none" stroke="#2f2a24" stroke-width="1.7" />
    <ellipse cx="63" cy="26" rx="2.6" ry="1.8" fill="#d5c3e8" stroke-width="1.6" />
    <ellipse cx="67" cy="27" rx="2.6" ry="1.8" fill="#e8dff0" stroke-width="1.6" />
    <ellipse cx="65" cy="20.5" rx="2.2" ry="1.5" fill="#f5f0f9" stroke-width="1.6" />
    <ellipse cx="68.5" cy="21.5" rx="2.2" ry="1.5" fill="#e8dff0" stroke-width="1.6" />

    <!-- 4. Mittlere Blattschicht (Sattes Basilikumgrün #6e995b) -->
    <!-- Unten links & rechts (große, schwere Blätter) -->
    <path d="M 46 80 C 33 82, 18 79, 13 70 C 10 63, 19 56, 30 60 C 39 63, 44 72, 46 80 Z" fill="#6e995b" stroke-width="2.3" />
    <path d="M 44 78 C 34 75, 25 71, 17 68 M 29 72 L 24 75 M 33 70 L 29 65" fill="none" stroke-width="1.2" />

    <path d="M 54 80 C 67 82, 82 79, 87 70 C 90 63, 81 56, 70 60 C 61 63, 56 72, 54 80 Z" fill="#6e995b" stroke-width="2.3" />
    <path d="M 56 78 C 66 75, 75 71, 83 68 M 71 72 L 76 75 M 67 70 L 71 65" fill="none" stroke-width="1.2" />

    <!-- Flanken links & rechts -->
    <path d="M 42 58 C 30 56, 17 49, 16 39 C 15 31, 25 28, 34 35 C 40 40, 42 49, 42 58 Z" fill="#6e995b" stroke-width="2.3" />
    <path d="M 40 55 C 33 49, 26 44, 20 39" fill="none" stroke-width="1.2" />

    <path d="M 58 58 C 70 56, 83 49, 84 39 C 85 31, 75 28, 66 35 C 60 40, 58 49, 58 58 Z" fill="#6e995b" stroke-width="2.3" />
    <path d="M 60 55 C 67 49, 74 44, 80 39" fill="none" stroke-width="1.2" />

    <!-- 5. Vordere Prachtblätter (Warmes, leuchtendes Kräutergrün #8bb574) -->
    <!-- Vordergrund Links-Mitte (Löffel-Wölbung mit Lichtkante) -->
    <path d="M 48 68 C 37 67, 26 60, 25 49 C 24 40, 35 37, 43 45 C 48 50, 49 60, 48 68 Z" fill="#8bb574" stroke-width="2.4" />
    <path d="M 46 65 C 39 59, 33 53, 29 48 M 38 58 L 32 59 M 40 54 L 39 48" fill="none" stroke-width="1.3" />
    <path d="M 31 43 C 36 43, 40 46, 42 51" fill="none" stroke="#a6cc8e" stroke-width="1.6" />

    <!-- Vordergrund Rechts-Mitte -->
    <path d="M 52 68 C 63 67, 74 60, 75 49 C 76 40, 65 37, 57 45 C 52 50, 51 60, 52 68 Z" fill="#8bb574" stroke-width="2.4" />
    <path d="M 54 65 C 61 59, 67 53, 71 48 M 62 58 L 68 59 M 60 54 L 61 48" fill="none" stroke-width="1.3" />
    <path d="M 69 43 C 64 43, 60 46, 58 51" fill="none" stroke="#a6cc8e" stroke-width="1.6" />

    <!-- Zentrales Herzblatt vorne unten -->
    <path d="M 50 78 C 43 73, 40 64, 44 57 C 47 52, 53 52, 56 57 C 60 64, 57 73, 50 78 Z" fill="#9ec486" stroke-width="2.3" />
    <path d="M 50 75 L 50 57 M 50 68 L 46 64 M 50 65 L 54 61" fill="none" stroke-width="1.2" />

    <!-- Obere Kragenblätter direkt unter den Blüten -->
    <path d="M 49 44 C 41 41, 35 35, 38 29 C 41 25, 47 30, 49 38 Z" fill="#9ec486" stroke-width="2.2" />
    <path d="M 51 44 C 59 41, 65 35, 62 29 C 59 25, 53 30, 51 38 Z" fill="#9ec486" stroke-width="2.2" />
    <path d="M 48 41 L 41 32 M 52 41 L 59 32" fill="none" stroke-width="1.1" />
  </g>
</svg>