<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2f2a24" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Hintere Schwertblätter (Dunkles Maisgrün #4b7338) -->
    <path d="M 48 66 C 36 52, 21 44, 8 48 C 19 36, 35 40, 49 58 Z" fill="#4b7338" stroke-width="2.2" />
    <path d="M 52 62 C 64 48, 79 40, 92 44 C 81 32, 65 36, 51 54 Z" fill="#4b7338" stroke-width="2.2" />

    <!-- 2. Untere & Mittlere Schwertblätter (Sattes Grün #68964b) -->
    <!-- Unten links (bogig überhängend) -->
    <path d="M 47 78 C 35 68, 20 66, 9 74 C 16 60, 32 58, 48 70 Z" fill="#68964b" stroke-width="2.3" />
    <path d="M 47 74 C 35 65, 23 64, 13 70" fill="none" stroke="#b8d99c" stroke-width="1.3" />

    <!-- Unten rechts -->
    <path d="M 53 76 C 65 66, 80 64, 91 72 C 84 58, 68 56, 52 68 Z" fill="#68964b" stroke-width="2.3" />
    <path d="M 53 72 C 65 63, 77 62, 87 68" fill="none" stroke="#b8d99c" stroke-width="1.3" />

    <!-- 3. Gegliederter Mais-Stängel (mit sichtbaren Knoten-Ringen) -->
    <path d="M 45 93 C 46 74, 47 52, 48 32 L 52 32 C 53 52, 54 74, 55 93 Z" fill="#82b059" stroke-width="2.4" />
    <!-- Horizontale Halmknoten (Nodien) -->
    <path d="M 45.5 80 L 54.5 80 M 46.5 66 L 53.5 66 M 47.5 52 L 52.5 52" fill="none" stroke-width="2" />

    <!-- 4. Obere Schwertblätter & Zentraler Blattschopf (Leuchtendes Maisgrün #82b059 & #99c76d) -->
    <!-- Mitte-Links hoch -->
    <path d="M 48 52 C 37 36, 22 27, 10 31 C 21 19, 37 24, 50 44 Z" fill="#82b059" stroke-width="2.3" />
    <path d="M 48 48 C 37 33, 25 26, 14 29" fill="none" stroke="#d5edb8" stroke-width="1.4" />

    <!-- Mitte-Rechts hoch -->
    <path d="M 52 48 C 63 32, 78 23, 90 27 C 79 15, 63 20, 50 40 Z" fill="#82b059" stroke-width="2.3" />
    <path d="M 52 44 C 63 29, 75 22, 86 25" fill="none" stroke="#d5edb8" stroke-width="1.4" />

    <!-- Aufrechter Trichter-Speer an der Spitze -->
    <path d="M 48 40 C 46 26, 47 15, 51 8 C 54 16, 54 27, 52 40 Z" fill="#99c76d" stroke-width="2.2" />
    <path d="M 49 36 C 43 24, 36 16, 29 14 C 37 12, 45 19, 50 32 Z" fill="#99c76d" stroke-width="2.1" />

    <!-- 5. Typische Mais-Stützwurzeln (Prop Roots) & Erde bei (50, 96) -->
    <path d="M 46 86 C 42 89, 39 92, 38 95 M 47 88 C 44 91, 43 93, 42 95 M 54 86 C 58 89, 61 92, 62 95 M 53 88 C 56 91, 57 93, 58 95" fill="none" stroke="#9e5b48" stroke-width="2.2" />
    <path d="M 46 86 C 42 89, 39 92, 38 95 M 54 86 C 58 89, 61 92, 62 95" fill="none" stroke="#2f2a24" stroke-width="1.4" />

    <path d="M 28 96 C 35 93, 43 93, 47 95 C 49 94, 51 94, 53 95 C 57 93, 65 93, 72 96 Z" fill="#8c7252" stroke-width="2.3" />
  </g>
</svg>