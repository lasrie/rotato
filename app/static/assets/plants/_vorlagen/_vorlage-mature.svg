<!-- Vorlage: ausgewachsene Pflanze (Stadium "mature")
     ViewBox 0 0 100 100 · Ankerpunkt unten Mitte (50, 96)
     Doppelkontur-Look: Hauptkontur #2f2a24, zweite Linie #6b6353 (60% Opazität)
     Fruchtfarbe am Ende je nach Familie anpassen (z. B. Tomate #e9a8a0) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hauptstiel -->
  <path d="M 50 96 C 49 86 48 74 50 62 C 51 52 50 44 49 36"
        fill="none" stroke="#2f2a24" stroke-width="4" stroke-linecap="round"/>
  <!-- Zweige -->
  <path d="M 50 70 C 42 66 36 60 34 52" fill="none" stroke="#2f2a24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 64 C 58 60 64 54 66 46" fill="none" stroke="#2f2a24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 49 50 C 44 46 42 40 43 34" fill="none" stroke="#2f2a24" stroke-width="3" stroke-linecap="round"/>
  <!-- Blätter (flache Farben, gewackelte Konturen) -->
  <path d="M 34 52 C 26 48 22 40 26 34 C 34 36 38 44 34 52 Z"
        fill="#7fa86f" stroke="#2f2a24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 66 46 C 74 42 78 34 74 28 C 66 30 62 38 66 46 Z"
        fill="#8fb87f" stroke="#2f2a24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 43 34 C 36 30 34 22 38 17 C 45 20 47 28 43 34 Z"
        fill="#9cc58a" stroke="#2f2a24" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 62 C 58 58 62 50 58 44 C 51 46 47 54 50 62 Z"
        fill="#7fa86f" stroke="#2f2a24" stroke-width="3" stroke-linecap="round"/>
  <!-- Frucht (Beispiel: Tomate — Farbe je Familie anpassen) -->
  <circle cx="57" cy="78" r="9" fill="#e9a8a0" stroke="#2f2a24" stroke-width="3"/>
  <path d="M 54 70 C 55 68 58 68 60 70" fill="none" stroke="#2f2a24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Zweitfrucht -->
  <circle cx="42" cy="82" r="7" fill="#e9a8a0" stroke="#2f2a24" stroke-width="3"/>
</svg>
