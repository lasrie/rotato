<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2f2a24" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Hintere Blattschicht (Dunkles Blattgrün #4b703c) -->
    <path d="M 46 72 C 34 71, 22 65, 17 55 C 25 51, 36 55, 43 63 Z" fill="#4b703c" stroke-width="2.2" />
    <path d="M 54 54 C 66 52, 78 46, 83 36 C 75 32, 64 36, 57 44 Z" fill="#4b703c" stroke-width="2.2" />
    <path d="M 47 38 C 36 35, 27 28, 25 19 C 33 17, 42 22, 47 30 Z" fill="#4b703c" stroke-width="2.2" />

    <!-- 2. Rustikale Bohnenstange (Holz #8c6747) -->
    <path d="M 47 12 L 52 12 L 53 95 L 46 95 Z" fill="#8c6747" stroke-width="2.3" />
    <ellipse cx="49.5" cy="12" rx="2.5" ry="1" fill="#b58d67" stroke-width="1.8" />
    <path d="M 49 18 L 49 44 M 50 62 L 50 88" fill="none" stroke-width="1.1" />

    <!-- 3. Sich um die Stange windender Bohnentrieb & Wurzel bei (50, 96) -->
    <!-- Unterer Bogen (vor der Stange von rechts nach links) -->
    <path d="M 35 96 C 43 95, 48 91, 51 84 C 55 76, 55 68, 49 61 C 44 55, 43 48, 48 42 C 53 36, 55 29, 50 21 C 48 17, 49 13, 53 9" fill="none" stroke="#628c4e" stroke-width="4.2" />
    <path d="M 35 96 C 43 95, 48 91, 51 84 C 55 76, 55 68, 49 61 C 44 55, 43 48, 48 42 C 53 36, 55 29, 50 21" fill="none" stroke="#2f2a24" stroke-width="2.2" />

    <!-- Verbreiterter Wurzelhals bei (50, 96) -->
    <path d="M 33 96 C 41 95, 45 91, 47 86 L 53 86 C 55 91, 59 95, 67 96 C 58 96.5, 54 95, 50 96 C 46 95, 42 96.5, 33 96 Z" fill="#8f7854" stroke-width="2.3" />

    <!-- 4. Charakteristische GERINGELTE KLETTERRANKEN (Schnurrbärte) -->
    <!-- Ranke oben rechts -->
    <path d="M 52 24 C 59 21, 66 22, 69 26 C 71 29, 67 32, 65 29 C 63 26, 68 23, 72 26" fill="none" stroke="#2f2a24" stroke-width="1.6" />
    <!-- Ranke Mitte links -->
    <path d="M 45 47 C 37 44, 30 45, 27 49 C 25 52, 29 55, 31 52 C 33 49, 28 46, 24 49" fill="none" stroke="#2f2a24" stroke-width="1.6" />

    <!-- 5. Typische dreizählige Bohnenblätter (Warmes Grün #628c4e & #7aa663) -->
    <!-- Blattgruppe unten rechts -->
    <path d="M 53 76 C 64 78, 76 74, 82 65 C 74 59, 62 61, 55 69 Z" fill="#628c4e" stroke-width="2.3" />
    <path d="M 55 73 C 64 71, 71 69, 78 66" fill="none" stroke-width="1.2" />
    <path d="M 53 75 C 58 83, 66 87, 73 85 C 71 78, 63 74, 53 75 Z" fill="#7aa663" stroke-width="2.1" />

    <!-- Blattgruppe Mitte links -->
    <path d="M 46 58 C 35 60, 23 56, 17 47 C 25 41, 37 43, 44 51 Z" fill="#7aa663" stroke-width="2.3" />
    <path d="M 44 55 C 35 53, 28 51, 21 48" fill="none" stroke-width="1.2" />
    <path d="M 46 57 C 41 65, 33 69, 26 67 C 28 60, 36 56, 46 57 Z" fill="#628c4e" stroke-width="2.1" />

    <!-- Blattgruppe oben rechts -->
    <path d="M 52 38 C 62 39, 73 35, 78 27 C 71 22, 60 24, 54 32 Z" fill="#7aa663" stroke-width="2.3" />
    <path d="M 54 35 C 62 33, 69 31, 74 28" fill="none" stroke-width="1.2" />

    <!-- Blatt oben links an der Spitze -->
    <path d="M 48 26 C 40 26, 32 22, 28 15 C 35 11, 43 14, 48 21 Z" fill="#8eb874" stroke-width="2.2" />

    <!-- 6. Erste Schmetterlingsblüten (Zartes Cremeweiß-Rosa #f5ebe6 & #e3c1b8) -->
    <!-- Blüte Mitte-Rechts -->
    <path d="M 53 50 C 58 48, 62 49, 64 52" fill="none" stroke-width="1.6" />
    <ellipse cx="66" cy="51" rx="4" ry="3" fill="#f5ebe6" stroke-width="1.8" />
    <ellipse cx="64" cy="54" rx="3" ry="2.2" fill="#e3c1b8" stroke-width="1.7" />
    <!-- Blüte Oben-Links -->
    <ellipse cx="38" cy="36" rx="3.8" ry="2.8" fill="#f5ebe6" stroke-width="1.8" />
    <ellipse cx="40" cy="39" rx="2.8" ry="2" fill="#e3c1b8" stroke-width="1.7" />
  </g>
</svg>