    <circle cx="29" cy="57" r="8.5" fill="#c85a43" stroke-width="2.4" />
    <path d="M 24 55 C 23 58, 25 61, 27 62" fill="none" stroke="#e0826d" stroke-width="1.5" />
    <!-- Kelchstern -->
