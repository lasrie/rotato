    <path d="M 36 52 C 36 55, 37 57, 39 58" fill="none" stroke="#e6917e" stroke-width="1.5" />
    <!-- Kelchstern -->
    <path d="M 37 46 L 41 48 L 45 46 M 39 50 L 41 48 L 43 50 M 41 44 L 41 48" fill="none" stroke="#2f2a24" stroke-width="1.6" />

    <!-- Große Haupt-Tomatenrispe RECHTS -->
    <!-- Hintere Tomaten -->
    <circle cx="69" cy="52" r="7" fill="#b04632" stroke-width="2.3" />
    <circle cx="60" cy="55" r="7.5" fill="#b04632" stroke-width="2.3" />
