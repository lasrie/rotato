    <polygon points="63,47 66,48 64,51 61,49" fill="#e8c86b" stroke-width="1.6" />
    <polygon points="58,48 61,50 59,53 56,50" fill="#e8c86b" stroke-width="1.6" />
    <polygon points="53,48 55,51 53,53 51,50" fill="#e8c86b" stroke-width="1.6" />

