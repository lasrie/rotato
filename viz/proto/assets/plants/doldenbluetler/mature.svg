<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2f2a24" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Hinterer Busch aus Fiederlaub (Dunkles Tannengrün #456135) -->
    <path d="M 46 74 C 34 62, 19 54, 8 55 C 12 47, 20 45, 26 48 C 22 40, 29 36, 36 42 C 35 35, 42 35, 45 43 C 47 52, 46 64, 46 74 Z" fill="#456135" stroke-width="2.2" />
    <path d="M 54 74 C 66 62, 81 54, 92 55 C 88 47, 80 45, 74 48 C 78 40, 71 36, 64 42 C 65 35, 58 35, 55 43 C 53 52, 54 64, 54 74 Z" fill="#456135" stroke-width="2.2" />
    <path d="M 48 68 C 40 48, 32 32, 24 22 C 30 20, 35 23, 38 28 C 38 21, 43 21, 46 28 C 48 38, 48 54, 48 68 Z" fill="#456135" stroke-width="2.2" />
    <path d="M 52 68 C 60 48, 68 32, 76 22 C 70 20, 65 23, 62 28 C 62 21, 57 21, 54 28 C 52 38, 52 54, 52 68 Z" fill="#456135" stroke-width="2.2" />

    <!-- 2. Mittlere Fiederwedel (Warmes Kräutergrün #688c52) -->
    <!-- Links unten & Mitte -->
    <path d="M 45 76 C 33 68, 20 66, 10 71 C 13 62, 20 59, 27 60 C 23 54, 29 50, 35 55 C 39 58, 43 67, 45 76 Z" fill="#688c52" stroke-width="2.2" />
    <path d="M 44 74 C 33 67, 22 65, 14 69" fill="none" stroke-width="1.2" />

    <!-- Rechts unten & Mitte -->
    <path d="M 55 76 C 67 68, 80 66, 90 71 C 87 62, 80 59, 73 60 C 77 54, 71 50, 65 55 C 61 58, 57 67, 55 76 Z" fill="#688c52" stroke-width="2.2" />
    <path d="M 56 74 C 67 67, 78 65, 86 69" fill="none" stroke-width="1.2" />

    <!-- 3. DOLDENBLÜTE (Charakteristischer Schirm oben in der Mitte) -->
    <!-- Stängel & Doldenstrahlen -->
    <path d="M 50 72 L 50 20" fill="none" stroke="#688c52" stroke-width="2.8" />
    <path d="M 50 72 L 50 20" fill="none" stroke="#2f2a24" stroke-width="2" />
    <!-- Hüllblättchen unter der Dolde -->
    <path d="M 50 22 C 45 23, 42 26, 40 28 M 50 22 C 55 23, 58 26, 60 28" fill="none" stroke-width="1.6" />
    <!-- Speichen der Dolde -->
    <path d="M 50 21 L 36 14 M 50 21 L 42 12 M 50 21 L 47 11 M 50 21 L 53 11 M 50 21 L 58 12 M 50 21 L 64 14" fill="none" stroke-width="1.3" />
    <!-- Weiße Blütenschirmchen (Cremeweiß #f7f4eb & #e6e0d0) -->
    <ellipse cx="35" cy="14" rx="4.5" ry="2.5" fill="#e6e0d0" stroke-width="1.8" />
    <ellipse cx="65" cy="14" rx="4.5" ry="2.5" fill="#e6e0d0" stroke-width="1.8" />
    <ellipse cx="41" cy="11.5" rx="5" ry="2.8" fill="#f7f4eb" stroke-width="1.8" />
    <ellipse cx="59" cy="11.5" rx="5" ry="2.8" fill="#f7f4eb" stroke-width="1.8" />
    <ellipse cx="50" cy="10" rx="6.5" ry="3.2" fill="#f7f4eb" stroke-width="1.9" />
    <!-- Dunkelroter Punkt in der Mitte (typische „Mohrenblüte“ der Wilden Möhre!) -->
    <circle cx="50" cy="10" r="1.3" fill="#7a2e2e" stroke="none" />

    <!-- 4. Vordere Fiederwedel (Leuchtendes Blattgrün #82a865) -->
    <!-- Links vorne -->
    <path d="M 48 75 C 41 60, 31 46, 20 40 C 26 36, 32 38, 36 42 C 34 34, 40 33, 44 40 C 47 47, 48 61, 48 75 Z" fill="#82a865" stroke-width="2.2" />
    <path d="M 47 72 C 40 58, 32 47, 24 41" fill="none" stroke-width="1.2" />

    <!-- Rechts vorne -->
    <path d="M 52 75 C 59 60, 69 46, 80 40 C 74 36, 68 38, 64 42 C 66 34, 60 33, 56 40 C 53 47, 52 61, 52 75 Z" fill="#82a865" stroke-width="2.2" />
    <path d="M 53 72 C 60 58, 68 47, 76 41" fill="none" stroke-width="1.2" />

    <!-- Kurze Herz-Wedel direkt über der Rübe -->
    <path d="M 49 75 C 45 64, 41 56, 36 53 C 40 49, 45 52, 48 58 C 49 63, 49 69, 49 75 Z" fill="#96bd77" stroke-width="2" />
    <path d="M 51 75 C 55 64, 59 56, 64 53 C 60 49, 55 52, 52 58 C 51 63, 51 69, 51 75 Z" fill="#96bd77" stroke-width="2" />

    <!-- 5. PRALLE KAROTTE / RÜBE an der Basis (Leuchtendes Karotten-Orange #d9692b & #e88348) -->
    <!-- Kleinere Seiten-Möhre rechts dahinter (für den „Ernte-Cluster“-Look) -->
    <path d="M 56 94 C 56 84, 59 77, 65 77 C 71 77, 73 84, 71 94 Z" fill="#bf561d" stroke-width="2.2" />
    <path d="M 61 83 C 64 84, 67 84, 69 83" fill="none" stroke-width="1.2" />

    <!-- Große Haupt-Möhre im Zentrum -->
    <path d="M 36 95 C 35 82, 39 72, 50 72 C 61 72, 65 82, 64 95 Z" fill="#d9692b" stroke-width="2.5" />
    <!-- Lichtkante links auf der Karotte -->
    <path d="M 40 92 C 39 83, 42 76, 47 74 C 44 78, 43 85, 44 92 Z" fill="#e88348" stroke="none" />
    <!-- Typische horizontale Wurzel-Rillen -->
    <path d="M 40 78 C 44 79, 48 79, 51 78 M 48 83 C 53 84, 57 84, 61 82 M 39 87 C 44 88, 49 88, 53 87 M 51 91 C 55 92, 59 91, 62 90" fill="none" stroke-width="1.4" />

    <!-- 6. Aufgeworfene Gartenerde am Wurzelpunkt (50, 96) -->
    <path d="M 24 96 C 30 92, 37 92, 42 95 C 46 92, 54 92, 58 95 C 63 92, 70 92, 76 96 C 64 96.5, 56 95.5, 50 96 C 44 95.5, 36 96.5, 24 96 Z" fill="#8c7252" stroke-width="2.4" />
  </g>
</svg>