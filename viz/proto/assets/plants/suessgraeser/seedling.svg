<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2f2a24" stroke-linecap="round" stroke-linejoin="round">

    <!-- Erstes überhängendes Mais-Grasblatt nach links -->
    <path d="M 49 78 C 44 64, 34 54, 19 56 C 28 47, 42 51, 50 68 Z" fill="#68964b" stroke-width="2.2" />
    <path d="M 49 72 C 42 60, 33 54, 24 55" fill="none" stroke="#b8d99c" stroke-width="1.2" />

    <!-- Zweites überhängendes Blatt nach rechts -->
    <path d="M 51 74 C 57 58, 68 47, 82 48 C 72 40, 58 45, 50 63 Z" fill="#7eb05d" stroke-width="2.2" />
    <path d="M 51 68 C 58 55, 67 48, 77 48" fill="none" stroke="#cde8b5" stroke-width="1.2" />

    <!-- Eingerollter zentraler Herz-Speer (Typisch Süßgräser!) -->
    <path d="M 49 76 C 48 60, 48 45, 51 34 C 53 45, 53 60, 51 76 Z" fill="#94c470" stroke-width="2.2" />

    <!-- Stängelbasis (Koleoptile) -->
    <path d="M 46 94 C 47 86, 48 79, 48.5 72 L 51.5 72 C 52 79, 53 86, 54 94 Z" fill="#82a860" stroke-width="2.2" />

    <!-- Halb sichtbares, goldenes Maiskorn an der Stängelbasis (Lehrbuch-Detail!) -->
    <ellipse cx="45" cy="92" rx="4" ry="3" fill="#e8b842" stroke-width="2" />
    <path d="M 44 91 C 45 90, 46 90, 47 91" fill="none" stroke="#fff0b8" stroke-width="1.2" />

    <!-- Verbreiterter Wurzelhals & Erde bei (50, 96) -->
    <path d="M 34 96 C 40 93, 46 93, 50 95 C 54 93, 60 93, 66 96 C 58 96.5, 53 95.5, 50 96 C 47 95.5, 42 96.5, 34 96 Z" fill="#8c7252" stroke-width="2.3" />
  </g>
</svg>