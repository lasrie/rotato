<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2f2a24" stroke-linecap="round" stroke-linejoin="round">

    <!-- Hinteres kleines Schlottenblatt -->
    <path d="M 49 86 C 47 74, 43 62, 38 52 C 42 57, 47 68, 50 85 Z" fill="#4e7566" stroke-width="2.1" />

    <!-- Typisches Keimblatt mit „Zwiebel-Knick“ (Schleife oben rechts) -->
    <path d="M 51 86 C 53 71, 57 55, 62 46 C 65 41, 69 43, 67 49 C 65 55, 61 61, 58 65 C 60 58, 63 51, 64 48 C 60 56, 56 71, 53 86 Z" fill="#659180" stroke-width="2.2" />

    <!-- Haupt-Röhrenblatt (straff aufrecht, leicht geschwungen) -->
    <path d="M 48 86 C 47 69, 47 51, 50 36 C 53 51, 53 69, 52 86 Z" fill="#7faba0" stroke-width="2.3" />
    <!-- Lichtstreifen auf dem runden Halm -->
    <path d="M 49.5 78 C 49 66, 49.5 54, 50 44" fill="none" stroke="#a3ccc2" stroke-width="1.3" />

    <!-- Kleine junge Steckzwiebel an der Basis -->
    <path d="M 43 95 C 42 89, 46 84, 50 83 C 54 84, 58 89, 57 95 Z" fill="#d99b5e" stroke-width="2.3" />
    <!-- Feine Längsmaserung der Zwiebelschale -->
    <path d="M 47 85 C 46 89, 46 92, 47 95 M 53 85 C 54 89, 54 92, 53 95" fill="none" stroke-width="1.2" />

    <!-- Verbreiterter Wurzelhals / Erdkrume bei (50, 96) -->
    <path d="M 35 96 C 41 94, 46 94, 50 96 C 54 94, 59 94, 65 96 Z" fill="#8c7252" stroke-width="2.2" />
  </g>
</svg>