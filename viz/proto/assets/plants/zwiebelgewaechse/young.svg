<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2f2a24" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Hintere Schlotten (Dunkles Blaugrün #46695b) -->
    <path d="M 47 80 C 42 63, 33 46, 22 34 C 31 42, 40 58, 49 79 Z" fill="#46695b" stroke-width="2.2" />
    <path d="M 53 80 C 58 63, 66 47, 75 36 C 67 45, 59 60, 51 79 Z" fill="#46695b" stroke-width="2.2" />

    <!-- 2. Mittlere Schlotten (Sattes Lauch-/Blaugrün #659180) -->
    <!-- Links mit umgeknickter Spitze (sehr typisch für Zwiebelbeete!) -->
    <path d="M 46 81 C 42 62, 39 43, 38 27 C 38 24, 35 24, 33 27 C 28 33, 24 41, 21 48 C 26 42, 31 36, 35 31 C 36 46, 40 64, 49 81 Z" fill="#659180" stroke-width="2.3" />

    <!-- Rechts straff geschwungen -->
    <path d="M 54 81 C 59 61, 63 41, 64 22 C 59 39, 54 60, 50 81 Z" fill="#659180" stroke-width="2.3" />

    <!-- 3. Vordere Haupt-Schlotten (Helles Bereiftes Blaugrün #7faba0) -->
    <!-- Mitte-Links (hoch aufragend) -->
    <path d="M 48 82 C 46 58, 46 34, 49 14 C 53 34, 53 58, 52 82 Z" fill="#7faba0" stroke-width="2.4" />
    <path d="M 49.5 72 C 49 54, 49 36, 49.5 22" fill="none" stroke="#a6d1c6" stroke-width="1.4" />

    <!-- Vorne Rechts (kürzeres Seitenblatt) -->
    <path d="M 52 82 C 57 68, 66 56, 77 49 C 67 59, 59 70, 55 82 Z" fill="#7faba0" stroke-width="2.2" />

    <!-- 4. Wachsende Zwiebelknolle (Goldbraun / Kupfer #c98a4b & #e0a669) -->
    <!-- Weißlich-hellgrüner Zwiebelhals -->
    <path d="M 45 83 C 45 78, 47 74, 50 74 C 53 74, 55 78, 55 83 Z" fill="#c5d6b8" stroke-width="2.2" />

    <!-- Bauchige Knolle -->
    <path d="M 38 95 C 36 87, 41 80, 50 80 C 59 80, 64 87, 62 95 Z" fill="#c98a4b" stroke-width="2.4" />
    <!-- Helle Lichtzone & Papierhaut-Streifen -->
    <path d="M 43 94 C 42 88, 45 82, 50 81 C 48 85, 47 90, 48 94 Z" fill="#e0a669" stroke="none" />
    <path d="M 44 81 C 41 86, 41 91, 43 95 M 50 80 L 50 95 M 56 81 C 59 86, 59 91, 57 95" fill="none" stroke-width="1.3" />

    <!-- 5. Erdkrume & feine weiße Wurzelspitzen bei (50, 96) -->
    <path d="M 29 96 C 35 93, 42 93, 46 95 C 48 94, 52 94, 54 95 C 58 93, 65 93, 71 96 Z" fill="#8c7252" stroke-width="2.3" />
  </g>
</svg>