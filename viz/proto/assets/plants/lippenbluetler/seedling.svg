<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2f2a24" stroke-linecap="round" stroke-linejoin="round">

    <!-- Erste echte Basilikumblätter (oben, rundlich-spitz und leicht gewölbt) -->
    <!-- Links hinten -->
    <path d="M 49 67 C 43 60, 36 56, 33 50 C 37 45, 45 47, 48 55 C 49 59, 49 63, 49 67 Z" fill="#6e995b" stroke-width="2.2" />
    <path d="M 48 64 C 44 58, 39 54, 36 51" fill="none" stroke-width="1.2" />

    <!-- Rechts vorne -->
    <path d="M 51 67 C 57 60, 65 56, 68 50 C 64 45, 55 47, 52 55 C 51 59, 51 63, 51 67 Z" fill="#8bb574" stroke-width="2.2" />
    <path d="M 52 64 C 56 58, 61 54, 65 51" fill="none" stroke-width="1.2" />

    <!-- Winzige Herzknospe in der Mitte -->
    <path d="M 50 64 C 48 59, 48 55, 50 53 C 52 55, 52 59, 50 64 Z" fill="#9ec486" stroke-width="1.9" />

    <!-- Typische breit-ovale / nierenförmige Basilikum-Keimblätter -->
    <!-- Links -->
    <path d="M 48 75 C 40 73, 30 75, 24 70 C 20 66, 23 59, 31 61 C 38 63, 44 69, 48 73 Z" fill="#8bb574" stroke-width="2.3" />
    <path d="M 47 74 C 39 71, 32 69, 26 66" fill="none" stroke-width="1.2" />

    <!-- Rechts -->
    <path d="M 52 75 C 60 73, 70 75, 76 70 C 80 66, 77 59, 69 61 C 62 63, 56 69, 52 73 Z" fill="#6e995b" stroke-width="2.3" />
    <path d="M 53 74 C 61 71, 68 69, 74 66" fill="none" stroke-width="1.2" />

    <!-- Kurzer, kräftiger Stängel mit Wurzelhals bei (50, 96) -->
    <path d="M 39 96 C 45 95, 47 91, 48 84 C 48.5 78, 48.5 71, 49.5 65 C 50.5 71, 51.5 78, 52 84 C 53 91, 55 95, 61 96 C 55 96.5, 53 95.5, 50 96 C 47 95.5, 45 96.5, 39 96 Z" fill="#8f7854" stroke-width="2.3" />

    <!-- Boden-Striche -->
    <path d="M 34 96 L 41 96 M 59 96 L 65 96" fill="none" stroke-width="1.8" />
  </g>
</svg>