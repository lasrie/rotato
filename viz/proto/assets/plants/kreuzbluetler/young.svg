<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2f2a24" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Hintere Kohlblätter (Dunkles Blaugrün #466b53) -->
    <path d="M 45 68 C 36 56, 24 47, 17 37 C 15 31, 22 27, 28 31 C 31 26, 38 28, 40 35 C 44 45, 45 57, 45 68 Z" fill="#466b53" stroke-width="2.2" />
    <path d="M 55 68 C 64 56, 76 47, 83 37 C 85 31, 78 27, 72 31 C 69 26, 62 28, 60 35 C 56 45, 55 57, 55 68 Z" fill="#466b53" stroke-width="2.2" />

    <!-- 2. Mittlere & Vordere Blätter an langen Stielen (Typisch Kohlrabi/Radieschen #638f72 & #7da88b) -->
    <!-- Blatt Links-Unten -->
    <path d="M 44 77 C 34 72, 23 68, 14 69 C 11 64, 16 58, 22 59 C 24 53, 32 54, 36 60 C 40 65, 42 71, 44 77 Z" fill="#638f72" stroke-width="2.2" />
    <path d="M 44 76 C 35 70, 26 65, 18 64" fill="none" stroke="#c8e3cf" stroke-width="2" />
    <path d="M 44 76 C 35 70, 26 65, 18 64" fill="none" stroke="#2f2a24" stroke-width="1.2" />

    <!-- Blatt Rechts-Unten -->
    <path d="M 56 77 C 66 72, 77 68, 86 69 C 89 64, 84 58, 78 59 C 76 53, 68 54, 64 60 C 60 65, 58 71, 56 77 Z" fill="#638f72" stroke-width="2.2" />
    <path d="M 56 76 C 65 70, 74 65, 82 64" fill="none" stroke="#c8e3cf" stroke-width="2" />
    <path d="M 56 76 C 65 70, 74 65, 82 64" fill="none" stroke="#2f2a24" stroke-width="1.2" />

    <!-- Großes Lappenblatt Mitte-Links -->
    <path d="M 47 71 C 42 56, 35 43, 31 30 C 29 22, 36 17, 42 21 C 45 16, 52 20, 50 28 C 53 33, 50 40, 47 45 C 48 54, 47 63, 47 71 Z" fill="#7da88b" stroke-width="2.3" />
    <path d="M 47 71 C 44 57, 41 42, 39 25 M 42 40 L 36 36 M 43 34 L 46 29" fill="none" stroke="#d5ede0" stroke-width="2.1" />
    <path d="M 47 71 C 44 57, 41 42, 39 25" fill="none" stroke="#2f2a24" stroke-width="1.2" />

    <!-- Großes Lappenblatt Mitte-Rechts -->
    <path d="M 53 71 C 58 56, 65 43, 69 30 C 71 22, 64 17, 58 21 C 55 16, 48 20, 50 28 C 47 33, 50 40, 53 45 C 52 54, 53 63, 53 71 Z" fill="#7da88b" stroke-width="2.3" />
    <path d="M 53 71 C 56 57, 59 42, 61 25 M 58 40 L 64 36" fill="none" stroke="#d5ede0" stroke-width="2.1" />
    <path d="M 53 71 C 56 57, 59 42, 61 25" fill="none" stroke="#2f2a24" stroke-width="1.2" />

    <!-- 3. Junge anschwellende Knolle über der Erde (Zartes Kohlrabi-Apfelgrün #a8cc8c mit Purpur-Wange #b85d6f) -->
    <ellipse cx="50" cy="81" rx="11" ry="9.5" fill="#a8cc8c" stroke-width="2.4" />
    <!-- Rötlich-violette Schattierung an der Unterseite (Verbindung aus Radieschen & Purpur-Kohlrabi) -->
    <path d="M 40 83 C 42 89, 47 90, 50 90 C 53 90, 58 89, 60 83 C 57 86, 53 87, 50 87 C 47 87, 43 86, 40 83 Z" fill="#b85d6f" stroke="none" />
    <ellipse cx="50" cy="81" rx="11" ry="9.5" fill="none" stroke-width="2.4" />
    <!-- Blattnarben / Ringe auf der Knolle -->
    <path d="M 43 79 C 46 80, 49 80, 51 79 M 52 83 C 55 83, 57 82, 58 81 M 44 85 C 47 86, 51 86, 54 85" fill="none" stroke-width="1.2" />

    <!-- 4. Pfahlwurzel-Hals & Erde bei (50, 96) -->
    <path d="M 46 90 L 48 95 L 52 95 L 54 90 Z" fill="#b85d6f" stroke-width="2.1" />
    <path d="M 29 96 C 36 93, 43 93, 47 95 C 49 94, 51 94, 53 95 C 57 93, 64 93, 71 96 Z" fill="#8c7252" stroke-width="2.3" />
  </g>
</svg>