<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rotato – Art-Prototyp Gartenkarte</title>
  <style>
    :root {
      --paper: #f4f1e6;      /* Papier-Grundton (Not-a-Trolley-Papier) */
      --paper-dark: #eae5d3;
      --ink: #2f2a24;        /* Tinten-Schwarzbraun für Konturen */
      --ink-soft: #6b6353;
      --grass: #b9d48a;      /* Rasen */
      --soil: #a97c50;       /* Beet-Erde */
      --soil-dark: #8a6540;
      --accent: #d95f43;     /* Warn-Orange-Rot (Konflikte) */
      --ok: #6faa4f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    #stage { position: fixed; inset: 0; display: block; touch-action: none; }

    /* ---------- HUD ---------- */
    .hud {
      position: fixed;
      font-size: 13px;
      color: var(--ink);
      user-select: none;
      z-index: 10;
    }
    .hud-top-left {
      top: 14px; left: 16px;
      font-weight: 700; letter-spacing: 0.02em;
      display: flex; align-items: center; gap: 10px;
    }
    .hud-top-left .sub { font-weight: 400; color: var(--ink-soft); }
    .hud-top-right {
      top: 12px; right: 16px;
      background: rgba(255,255,255,0.85);
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: 2px 2px 0 rgba(47,42,36,0.25);
    }
    .hud-bottom {
      bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 8px 18px;
      display: flex; gap: 14px; align-items: center;
      box-shadow: 3px 3px 0 rgba(47,42,36,0.18);
    }
    .hud-bottom input[type=range] { width: 260px; accent-color: var(--ink); }
    .hud-month { font-weight: 700; min-width: 92px; }
    .hud-hint {
      bottom: 14px; left: 16px;
      color: var(--ink-soft);
      background: rgba(255,255,255,0.75);
      border-radius: 8px; padding: 4px 10px;
      max-width: 340px;
    }
    .hud-badge {
      position: fixed; z-index: 20;
      max-width: 320px;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 4px 4px 0 rgba(47,42,36,0.25);
      font-size: 13px; line-height: 1.45;
      opacity: 0; transform: translateY(6px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }
    .hud-badge.show { opacity: 1; transform: translateY(0); }
    .hud-badge .t { font-weight: 700; margin-bottom: 2px; }
    .hud-badge.warn .t { color: var(--accent); }
    .hud-badge.ok .t { color: var(--ok); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="hud hud-top-left">🌱 rotato <span class="sub">Art-Prototyp · Garten 91</span></div>

  <div class="hud hud-top-right" id="status">○ Prototyp · keine Pod-Verbindung</div>

  <div class="hud hud-bottom">
    <span class="hud-month" id="hud-month">Januar</span>
    <input type="range" id="hud-scrub" min="0" max="11" value="5" step="1"
           aria-label="Saison wählen" />
    <span id="hud-year">2025</span>
  </div>

  <div class="hud hud-hint">
    Ziehen zum Verschieben · Scrollen zum Zoomen · Beet antippen für Details.
    Drag des Beets „Jungpflanzen-Anzuchtkasten" auf ein anderes Beet = Umpflanzen-Demo.
  </div>

  <div class="hud-badge" id="badge"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
